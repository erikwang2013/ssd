name: CI

# 仅手动触发（Actions 页 "Run workflow"），不随 push / PR 自动执行。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --release --locked
        if: runner.os == 'Linux'
        # release 档矩阵：debug/release 行为分歧型缺陷（如 exFAT C1 分配帽）只跑 debug 会漏（qual-t2 注记）
      - run: bash scripts/e2e.sh
        if: runner.os == 'Linux'
      - run: bash scripts/e2e-loop.sh
        if: runner.os == 'Linux'

  package-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq
      - run: sudo apt-get install -y libxml2-utils
      - run: cargo build --locked --release -p xd-daemon
      - run: bash scripts/build-deb.sh
      - run: docker info >/dev/null
      - run: bash scripts/e2e-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xiaodun-deb
          path: dist/*.deb
          if-no-files-found: error

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: cargo build -p xd-daemon --locked
      - run: flutter analyze
      - run: flutter test
        env:
          XD_DAEMON_BIN: ${{ github.workspace }}/target/debug/xd-daemon
