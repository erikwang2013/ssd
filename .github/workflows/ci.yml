name: CI

# 仅手动触发（Actions 页 "Run workflow"），不随 push / PR 自动执行。
# packaging=true 追加 package-windows/package-macos（flutter build windows/macos 重成本，
# 常规轮次不摊；用法见 README「打包」节）。
on:
  workflow_dispatch:
    inputs:
      packaging:
        description: '构建 Windows/macOS 安装包并冒烟（约 +20 分钟；默认 false）'
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
        # --no-fail-fast（T9 可移植性修复轮申报偏离）：默认 fail-fast 会在首个红测试目标处
        # 中止本轮——Windows 上 xd-core 一红，xd-daemon（export_ipc/scan_ipc…）整轮都跑不到，
        # 多平台修复轮每次只暴露 1 个红点。开全跑后单轮暴露全部红点。
      - run: cargo test -p xd-device --test macos_smoke --locked -- --nocapture
        if: runner.os == 'macOS'
        # 弱断言分支取证（qual-m1e-t3 P7）：eprintln 在通过时被 cargo test 捕获不打印，
        # 单独跑 --nocapture 才能判别 runner 走 Ok（有权限）还是 PermissionDenied（无 FDA）分支。
      - run: cargo test -p xd-daemon --test tcp_session --locked -- --nocapture root_daemon_hands_port_file_back_to_owner_user
        if: runner.os == 'Linux' || runner.os == 'macOS'
        # root 门控测试真执行/跳过二值取证（spec-m1e-t4 addendum）：`... ok` 分不出真跑与
        # 免密 sudo 缺失的早退 skip——`--nocapture` 下「ran:」与「skip:」可辨。
        # macOS 腿同样加：该测试在 `#[cfg(unix)]` 之内，此前无任何日志直证（无 sudo 即打 skip）。
      - run: cargo test --workspace --release --locked --no-fail-fast
        if: runner.os == 'Linux'
        # release 档矩阵：debug/release 行为分歧型缺陷（如 exFAT C1 分配帽）只跑 debug 会漏（qual-t2 注记）
      - run: bash scripts/e2e.sh
        if: runner.os == 'Linux'
      - run: bash scripts/e2e-loop.sh
        if: runner.os == 'Linux'

  package-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -qq
      - run: sudo apt-get install -y libxml2-utils
      - run: cargo build --locked --release -p xd-daemon
      - run: bash scripts/build-deb.sh
      - run: docker info >/dev/null
      - run: bash scripts/e2e-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xiaodun-deb
          path: dist/*.deb
          if-no-files-found: error

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: cargo build -p xd-daemon --locked
      - run: flutter analyze
      - run: flutter test
        env:
          XD_DAEMON_BIN: ${{ github.workspace }}/target/debug/xd-daemon

  package-windows:
    # 手动门控（T5）：仅 dispatch 输入 packaging=true 时运行——flutter build windows 重成本，
    # 常规 CI 轮次不摊。用法：Actions → CI → Run workflow → packaging=true。
    if: github.event.inputs.packaging == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
      - run: flutter pub get --enforce-lockfile
        working-directory: ui
      - run: pwsh -NoProfile -File scripts/package-windows.ps1
      - run: pwsh -NoProfile -File scripts/e2e-package-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: xiaodun-windows-zip
          path: dist/*.zip
          if-no-files-found: error

  package-macos:
    # 同 package-windows（手动门控）；zip 架构 = runner 架构（macos-latest 目前 arm64）。
    if: github.event.inputs.packaging == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
      - run: flutter pub get --enforce-lockfile
        working-directory: ui
      - run: bash scripts/package-macos.sh
      - run: bash scripts/e2e-package-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xiaodun-macos-zip
          path: dist/*.zip
          if-no-files-found: error
