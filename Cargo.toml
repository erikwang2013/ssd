[workspace]
resolver = "3"
members = [
    "crates/xd-core",
    "crates/xd-device",
    "crates/xd-daemon",
    "crates/xd-ffi",
    "crates/xd-fixtures",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
