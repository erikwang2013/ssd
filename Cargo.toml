[workspace]
resolver = "3"
members = [
    "crates/xd-core",
    "crates/xd-carving",
    "crates/xd-device",
    "crates/xd-daemon",
    "crates/xd-ffi",
    "crates/xd-fixtures",
    "crates/xd-fs-fat",
    "crates/xd-fs-exfat",
]

[workspace.package]
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
base64 = "0.23.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["fs", "process", "thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
