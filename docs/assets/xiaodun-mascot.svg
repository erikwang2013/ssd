      <stop offset="1" stop-color="#2456C9"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 地面阴影 -->
  <ellipse cx="256" cy="462" rx="128" ry="18" fill="#1E4FBF" opacity="0.10"/>

