  <circle cx="304" cy="212" r="15" fill="#14224A"/>
  <circle cx="202" cy="206" r="5" fill="#FFFFFF"/>
  <circle cx="298" cy="206" r="5" fill="#FFFFFF"/>
  <path d="M 228 262 Q 256 286 284 262" fill="none" stroke="#14224A" stroke-width="10" stroke-linecap="round"/>

