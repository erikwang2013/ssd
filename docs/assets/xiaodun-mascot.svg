  <path d="M 160 128 L 352 128 Q 368 128 368 144 L 368 238 C 368 312 322 372 256 414 C 190 372 144 312 144 238 L 144 144 Q 144 128 160 128 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5"/>

