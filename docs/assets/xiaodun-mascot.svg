<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="小盾吉祥物：一面蓝色小盾牌，笑着举起双手，捧回一张带绿色对勾的文件">
  <title>小盾 · Xiaodun 吉祥物</title>
  <metadata>© 2026 erik · https://erik.xyz · erik@erik.xyz</metadata>
  <desc>蓝色盾牌造型的小盾吉祥物：圆润的盾身、腮红笑脸，双手上举，胸前是一张恢复成功、带绿色对勾的文件，旁边闪着金色星光。</desc>
