  <rect x="352" y="238" width="76" height="30" rx="15" fill="#7FB3FF" transform="rotate(-30 352 253)"/>

  <!-- 盾身 -->
  <path d="M 148 108 L 364 108 Q 388 108 388 132 L 388 236 C 388 322 336 390 256 436 C 176 390 124 322 124 236 L 124 132 Q 124 108 148 108 Z" fill="url(#bodyGrad)"/>
