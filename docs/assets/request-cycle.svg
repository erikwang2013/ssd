<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 684" width="960" height="684" role="img" aria-label="小盾请求周期：一次 device.list 请求从 UI 页面经 IpcCoreClient 写 stdin、daemon 处理并写回 stdout、直到 UI 渲染列表的完整时序">
  <title>小盾 · 请求周期（一次 device.list 的完整往返）</title>
  <metadata>© 2026 erik · https://erik.xyz · erik@erik.xyz</metadata>
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E6BE6"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="668" rx="18" fill="#F7F9FD" stroke="#E3E9F4"/>

  <text x="40" y="46" font-size="20" font-weight="700" fill="#16233F" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">小盾 · 请求周期</text>
  <text x="928" y="46" font-size="11.5" text-anchor="end" fill="#5B6B85" font-family="system-ui, 'PingFang SC', sans-serif">一次 device.list 的完整往返（JSON-RPC over stdio）</text>

  <!-- 参与方 -->
  <rect x="55" y="64" width="250" height="46" rx="11" fill="#EAF1FF" stroke="#2E6BE6" stroke-width="1.5"/>
  <text x="180" y="93" font-size="13" font-weight="700" text-anchor="middle" fill="#16233F" font-family="system-ui, 'PingFang SC', sans-serif">HomePage（UI 页面）</text>

  <rect x="355" y="64" width="250" height="46" rx="11" fill="#EAF1FF" stroke="#2E6BE6" stroke-width="1.5"/>
  <text x="480" y="93" font-size="13" font-weight="700" text-anchor="middle" fill="#16233F" font-family="system-ui, 'PingFang SC', sans-serif">IpcCoreClient（transport）</text>

  <rect x="655" y="64" width="250" height="46" rx="11" fill="#DCE9FF" stroke="#2E6BE6" stroke-width="1.5"/>
  <text x="780" y="93" font-size="13" font-weight="700" text-anchor="middle" fill="#16233F" font-family="system-ui, 'PingFang SC', sans-serif">xd-daemon（子进程）</text>

  <!-- 生命线 -->
  <line x1="180" y1="110" x2="180" y2="616" stroke="#C6D8F7" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="480" y1="110" x2="480" y2="616" stroke="#C6D8F7" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="780" y1="110" x2="780" y2="616" stroke="#C6D8F7" stroke-width="1.4" stroke-dasharray="5 5"/>

  <!-- ① UI → transport -->
  <text x="330" y="148" font-size="11.5" text-anchor="middle" fill="#16233F" font-family="ui-monospace, monospace">listDevices()</text>
  <line x1="180" y1="158" x2="476" y2="158" stroke="#2E6BE6" stroke-width="1.7" marker-end="url(#ra)"/>

  <!-- ② transport 内部 -->
  <line x1="496" y1="198" x2="481" y2="198" stroke="#C6D8F7" stroke-width="1.3"/>
  <rect x="496" y="176" width="280" height="46" rx="9" fill="#FFFFFF" stroke="#C6D8F7" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="510" y="197" font-size="10.5" fill="#16233F" font-family="ui-monospace, monospace">_call('device.list')</text>
  <text x="510" y="213" font-size="10.5" fill="#5B6B85" font-family="system-ui, 'PingFang SC', sans-serif">分配 id=1，登记 Completer（10s 超时）</text>

  <!-- ③ transport → daemon -->
  <text x="630" y="252" font-size="11.5" text-anchor="middle" fill="#16233F" font-family="system-ui, 'PingFang SC', sans-serif">写 stdin：一行 JSON（encodeRequest）</text>
  <line x1="480" y1="262" x2="776" y2="262" stroke="#2E6BE6" stroke-width="1.7" marker-end="url(#ra)"/>
  <text x="630" y="280" font-size="9.5" text-anchor="middle" fill="#7C8DB0" font-family="ui-monospace, monospace">{"jsonrpc":"2.0","id":1,"method":"device.list","params":null}</text>

  <!-- ④ daemon 内部 -->
  <line x1="766" y1="318" x2="781" y2="318" stroke="#C6D8F7" stroke-width="1.3"/>
  <rect x="494" y="296" width="272" height="46" rx="9" fill="#FFFFFF" stroke="#C6D8F7" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="508" y="317" font-size="10.5" fill="#16233F" font-family="ui-monospace, monospace">serde_json → handle_request(&amp;ctx, &amp;req)</text>
  <text x="508" y="333" font-size="10.5" fill="#5B6B85" font-family="system-ui, 'PingFang SC', sans-serif">解析失败 → -32700，流保持存活</text>

  <!-- ⑤ daemon 内部 -->
  <line x1="766" y1="374" x2="781" y2="374" stroke="#C6D8F7" stroke-width="1.3"/>
  <rect x="494" y="352" width="272" height="46" rx="9" fill="#FFFFFF" stroke="#C6D8F7" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="508" y="373" font-size="10.5" fill="#16233F" font-family="ui-monospace, monospace">CoreCtx.device_infos()</text>
  <text x="508" y="389" font-size="10.5" fill="#5B6B85" font-family="system-ui, 'PingFang SC', sans-serif">只读克隆设备列表</text>

  <!-- ⑥ daemon → transport -->
  <text x="630" y="428" font-size="11.5" text-anchor="middle" fill="#16233F" font-family="system-ui, 'PingFang SC', sans-serif">写 stdout：一行 JSON 响应（id=1 回显）</text>
  <line x1="780" y1="438" x2="484" y2="438" stroke="#2E6BE6" stroke-width="1.7" marker-end="url(#ra)"/>
  <text x="630" y="456" font-size="9.5" text-anchor="middle" fill="#7C8DB0" font-family="ui-monospace, monospace">{"jsonrpc":"2.0","id":1,"result":{"devices":[…]}}</text>

  <!-- ⑦ transport 内部 -->
  <line x1="496" y1="494" x2="481" y2="494" stroke="#C6D8F7" stroke-width="1.3"/>
  <rect x="496" y="472" width="280" height="46" rx="9" fill="#FFFFFF" stroke="#C6D8F7" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="510" y="493" font-size="10.5" fill="#16233F" font-family="ui-monospace, monospace">_onLine → decodeResult</text>
  <text x="510" y="509" font-size="10.5" fill="#5B6B85" font-family="system-ui, 'PingFang SC', sans-serif">id 匹配 → Completer.complete</text>

  <!-- ⑧ transport → UI -->
  <text x="330" y="532" font-size="11.5" text-anchor="middle" fill="#16233F" font-family="system-ui, 'PingFang SC', sans-serif">Future 完成（List&lt;DeviceInfo&gt;）</text>
  <line x1="480" y1="542" x2="184" y2="542" stroke="#2E6BE6" stroke-width="1.7" marker-end="url(#ra)"/>

  <!-- ⑨ UI 内部 -->
  <line x1="196" y1="578" x2="181" y2="578" stroke="#C6D8F7" stroke-width="1.3"/>
  <rect x="196" y="556" width="280" height="32" rx="9" fill="#FFFFFF" stroke="#C6D8F7" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="210" y="577" font-size="10.5" fill="#16233F" font-family="system-ui, 'PingFang SC', sans-serif">FutureBuilder 渲染设备列表（三态）</text>

  <!-- 超时路径 -->
  <rect x="330" y="604" width="520" height="44" rx="10" fill="#FBFCFE" stroke="#9AA7BD" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="590" y="631" font-size="11" text-anchor="middle" fill="#5B6B85" font-family="system-ui, 'PingFang SC', sans-serif">超时路径：10 秒无响应 → TimeoutException（pending 移除）→ UI 错误态（可重试）</text>
  <text x="920" y="674" font-size="9.5" text-anchor="end" fill="#9AA7BD" opacity="0.75" font-family="ui-monospace, monospace">© erik.xyz · erik@erik.xyz</text>
</svg>
