[package]
name = "xd-device"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }

# Windows 物理盘枚举/只读句柄（windows.rs）。仅 windows 目标编译；真机语义未验证（见
# docs/security §8）。版本与 xd-daemon 对齐 0.61（同 workspace 不引双版本）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",                           # HANDLE/INVALID_HANDLE_VALUE/GENERIC_READ/CloseHandle
    "Win32_Security",                             # CreateFileW 的 SECURITY_ATTRIBUTES 参数门控
    "Win32_Storage_FileSystem",                   # CreateFileW/ReadFile/SetFilePointerEx/FILE_*/BusType*
    "Win32_System_IO",                            # ReadFile/DeviceIoControl
    "Win32_System_Ioctl",                         # IOCTL_*/GUID_DEVINTERFACE_DISK/STORAGE_* 结构
    "Win32_Devices_DeviceAndDriverInstallation",  # SetupAPI 枚举（SetupDiGetClassDevsW…）
] }

# macOS 物理盘枚举/只读打开（macos.rs）。仅 macOS 目标编译；真机语义未验证（见 docs/security §9）。
# rustix 走 workspace 依赖表（1.1.5）；libc 取 lockfile 既有版本（0.2.189，DKIOC ioctl 出参）。
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
rustix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
